# Pale blue chrome around white content, in the style of classic Windows DICOM viewers

@background = #DCE8F6
@foreground = #1B2A3A
@accentColor = #2F6DB5
@selectionBackground = #3A7BD5
@selectionInactiveBackground = #C3D7F0
@componentBackground = #FFFFFF

Panel.background = @background
MenuBar.background = #CCDFF4
MenuBar.borderColor = #A9C4E6
Menu.background = #CCDFF4
MenuItem.background = #F7FAFE
PopupMenu.background = #F7FAFE
ToolBar.background = #D3E3F6
ToolBar.borderColor = #A9C4E6
TitlePane.background = #CCDFF4
TitlePane.inactiveBackground = #DCE8F6
MenuBar.hoverBackground = #FCE7A8
MenuItem.selectionBackground = #FCE7A8
MenuItem.selectionForeground = #1B2A3A
Menu.selectionBackground = #FCE7A8
Menu.selectionForeground = #1B2A3A
Button.hoverBackground = #FCE7A8
ToggleButton.selectedBackground = #F9D77E
ToggleButton.toolbar.selectedBackground = #F9D77E
Button.toolbar.hoverBackground = #FCE7A8
Button.toolbar.pressedBackground = #F9D77E

List.background = #FFFFFF
Table.background = #FFFFFF
Tree.background = #FFFFFF
TextField.background = #FFFFFF
ComboBox.background = #FFFFFF
TableHeader.background = #E7EFF9
TabbedPane.background = @background
TabbedPane.selectedBackground = #FFFFFF
TabbedPane.underlineColor = @accentColor
ScrollPane.background = #FFFFFF
Component.borderColor = #A9C4E6
Component.focusColor = @accentColor
Separator.foreground = #A9C4E6
Label.disabledForeground = #5E7085
