WeasisWin.anonymize.warn=<html><body>Особисті дані пацієнта замінюються на екрані та в зображеннях, які створює програма (знімки екрана, друк, експорт зображень), але це <b>не знеособлення</b>.<ul><li>Текст, впалений у пікселі знімка, <b>автоматично не приховується</b>: обведіть його замкненими фігурами й застосуйте їх на <b>Панелі приховування</b> 2D-переглядача.</li><li>DICOM-файли, експортовані чи надіслані з програми, <b>зберігають початкові атрибути</b>. Для знеособлення DICOM-даних скористайтеся <a href="https://karnak.weasis.org/">Karnak</a>.</li></ul>Завжди переглядайте кожен знімок, перш ніж ним ділитися.</body></html>
